name: measure deploy

# The browser half of `npm run measure`, against the real deployed page.
#
# The earlier plan was to build and serve the site inside CI. That does not
# work and should not be forced to: `next build` runs the archive queries for
# real, so it needs live credentials, and a fixture mode that returned fake
# galleries would be a footgun pointed at the public site — CLAUDE.md is
# explicit that failing the deploy is the cheaper outcome.
#
# Measuring the deployment is strictly better anyway. Real data, real
# credentials, real CDN, and the page a visitor is actually served rather than
# a local approximation of it.
on:
  deployment_status:

jobs:
  measure:
    # A deployment that came up, and that published a URL to measure — the
    # event carries an empty environment_url often enough to be worth guarding.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Measure the deployment
        env:
          # Preview deployments are still behind Vercel Authentication, and the
          # secret is Vercel's own answer for automation: Project Settings >
          # Deployment Protection > Protection Bypass for Automation, then add
          # it here as a repository secret of the same name. Production does
          # not need it — see PROD_BASE below. Without it a preview run skips
          # with that message rather than measuring a wall and calling it a
          # pass.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The public production alias, which is the page a client following a
          # shared link is actually served. Every deployment_status event
          # carries the immutable per-deployment URL instead
          # (beuntamed-photo-<hash>-...vercel.app), and those are protected, so
          # this job skipped on every production deploy while the site itself
          # was public the whole time. Measured 2026-09-13: this host answers
          # 200 with the archive anonymously on /, /work, /about, an album and
          # a genre page; the two project-scoped hosts 302 to vercel.com/sso.
          #
          # Change this when a custom domain is attached, at the same time as
          # NEXT_PUBLIC_SITE_URL — see pending-task.md § 1 and src/lib/site.ts.
          PROD_BASE: https://beuntamed-photo.vercel.app
          # ubuntu-latest ships Google Chrome, which the harness finds on its
          # own; this just removes the guesswork.
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          BASE="${{ github.event.deployment_status.environment_url }}"
          if [ "${{ github.event.deployment_status.environment }}" = "Production" ]; then
            BASE="$PROD_BASE"
          fi
          echo "Measuring $BASE"
          npm run measure -- --base "$BASE"

# What this measures, and why each line is here — every one of them is a
# regression that shipped, and design.md § 12 has the full list:
#
#   height drift across a full scroll, which must be 0   (a section grew 575px
#                                                         under the reader)
#   how many typefaces the page draws in                 (three were specified
#                                                         and none applied, for
#                                                         months)
#   every sizes slot against the candidate chosen        (one pulled 1500w into
#                                                         a 167px box)
#   sticky tops against env(safe-area-inset-top)         (shipped broken twice)
#   screen count, and display type as a share of vw
#
# The static gates run on every push in checks.yml. This job is the half that
# needs a rendered page, and it is the half that caught most of them.
#
# The first run of this workflow failed, and how it failed is worth keeping.
# Without the bypass secret it measured Vercel's authentication page and
# reported ten design failures against it — "draws in 1 typefaces, expected
# 2 — GeistSans", sticky `.fixed` and `.w-full` elements, a `.text-heading-32`
# heading. Every one of those belongs to Vercel's page, not this site.
#
# The guard in the harness had checked for HTTP 401 or 403. Vercel does not
# refuse the request: it answers **200 with a login page**. So the check is now
# identity rather than reachability — the page must contain this site's own
# wordmark, read from src/lib/site.ts — and it skips with the remedy instead of
# measuring whatever happened to answer. Tested against a server that imitates
# what Vercel actually returns, which is what the first version was not.
